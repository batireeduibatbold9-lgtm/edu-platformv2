<!doctype html>
<html lang="mn">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2563eb"><meta name="description" content="EDU+ сургалтын удирдлагын платформ">
  <title>EDU+ — Сургалтын платформ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="toast-container"></div>
<section id="auth-view" class="auth-shell">
  <div class="auth-brand"><div class="brand-mark">E<span>+</span></div><div><b>EDU+</b><small>Сургалтын нэгдсэн платформ</small></div></div>
  <div class="auth-card">
    <div class="eyebrow">WELCOME BACK</div><h1>Сургалтаа нэг дороос удирд.</h1><p class="muted">Багш, сурагч, сургалтын удирдлагад зориулсан орчин.</p>
    <div class="tabs"><button id="login-tab" class="tab active">Нэвтрэх</button><button id="signup-tab" class="tab">Бүртгүүлэх</button></div>
    <form id="login-form"><label>Имэйл</label><input id="login-email" type="email" placeholder="name@example.com" required><label>Нууц үг</label><input id="login-password" type="password" placeholder="••••••••" required><button class="primary full" type="submit">Нэвтрэх →</button></form>
    <form id="signup-form" class="hidden"><label>Овог нэр</label><input id="signup-name" placeholder="Бат Болд" required><label>Имэйл</label><input id="signup-email" type="email" required><label>Нууц үг</label><input id="signup-password" type="password" minlength="6" required><button class="primary full" type="submit">Бүртгэл үүсгэх →</button></form>
  </div>
  <div class="auth-footer">© 2026 EDU+ · Secure learning environment</div>
</section>
<section id="app-view" class="hidden app-shell">
  <aside class="sidebar"><div class="brand"><div class="brand-mark">E<span>+</span></div><div><b>EDU+</b><small>Learning Platform</small></div></div><div id="user-mini" class="user-mini"></div><div class="nav-label">ҮНДСЭН ЦЭС</div><nav id="nav"></nav><div class="sidebar-bottom"><button id="logout-btn" class="logout">↪ Гарах</button></div></aside>
  <main class="main"><header class="topbar"><div><div id="breadcrumb" class="breadcrumb">EDU+ / Dashboard</div><h1 id="page-title">Dashboard</h1><p id="page-subtitle" class="muted"></p></div><div class="top-actions"><button id="refresh-btn" class="icon-btn" title="Refresh">↻</button><button id="profile-btn" class="avatar-btn"></button></div></header><div id="content"></div></main>
</section>
<div id="modal" class="modal hidden"><div class="modal-box"><button id="modal-close" class="modal-close">×</button><div id="modal-content"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module" src="js/app.js"></script>
</body></html>
